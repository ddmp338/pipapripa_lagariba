{% extends "base.html" %}
{% block title %}{{ 'Editar' if autor else 'Novo' }} Autor{% endblock %}
{% block content %}
<h2>{{ 'Editar' if autor else 'Novo' }} Autor</h2>
<form method="POST" class="needs-validation" novalidate>
    <div class="mb-3">
        <label for="nome" class="form-label">Nome *</label>
        <input type="text" class="form-control" id="nome" name="nome" value="{{ autor.nome if autor else '' }}" required>
        <div class="invalid-feedback">O nome é obrigatório.</div>
    </div>
    <div class="mb-3">
        <label for="data_nascimento" class="form-label">Data de Nascimento</label>
        <input type="date" class="form-control" id="data_nascimento" name="data_nascimento" value="{{ autor.data_nascimento.strftime('%Y-%m-%d') if autor and autor.data_nascimento else '' }}">
    </div>
    <button type="submit" class="btn btn-primary">{{ 'Atualizar' if autor else 'Criar' }}</button>
    <a href="{{ url_for('listar_autores') }}" class="btn btn-secondary">Cancelar</a>
</form>
<script>
    // Validação simples para os campos obrigatórios (puro Bootstrap)
    (function () {
        'use strict'
        var forms = document.querySelectorAll('.needs-validation')
        Array.prototype.slice.call(forms).forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>
{% endblock %}
